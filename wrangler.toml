# Cloudflare Workers（OpenNext）。绑定的是已创建的 D1 / R2。
name = "zhiyi-yun-gong"
account_id = "d0e845fde248a912a971bdeb055c6bd4"
main = ".open-next/worker.js"
compatibility_date = "2026-10-11"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# OpenNext 在 Workers 内回调自身时使用。service 必须与 name 一致。
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "zhiyi-yun-gong"

[[d1_databases]]
binding = "DB"
database_name = "zhiyi-yun-gong"
database_id = "b23791bd-f7ac-41c9-8140-9088ed998df6"
migrations_dir = "prisma/d1/migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "zhiyi-yun-gong-uploads"

# Prisma 在加载 schema 时会读取该变量。Workers 上实际查询走 D1 适配器，不会打开这个文件。
[vars]
DATABASE_URL = "file:./dev.db"
